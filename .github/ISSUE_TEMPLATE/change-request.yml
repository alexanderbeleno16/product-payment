name: Change request
description: Propose a scoped change to the application or its development workflow.
title: "[Change]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Describe the current situation and why a change is needed.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result, not only a suggested implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the observable conditions that would make this change complete.
    validations:
      required: true
